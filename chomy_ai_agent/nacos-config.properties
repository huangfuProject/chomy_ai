# 将本文件内容粘贴到 Nacos 的 Properties 配置中。
# Data ID、Group 和命名空间应与项目 .env 中的 NACOS_CONFIG_DATA_ID、
# NACOS_CONFIG_GROUP、NACOS_NAMESPACE_ID 一致。
# 以下模型名称与参数沿用此前提供的配置，发布前请确认实际模型名称并替换 API Key。

# ==================== 全局模型配置 ====================
# 默认模型 ID，必须出现在 modelIds 列表中。
default.modelId=deepseek-flash

# 所有模型 ID，多个模型用英文逗号分隔。
# 每个 ID 都需要配置对应的 <模型ID>.* 参数。
modelIds=deepseek-flash

# ==================== 基础连接 ====================
# 模型唯一标识，需要与配置前缀和 modelIds 中的 ID 一致。
deepseek-flash.modelId=deepseek-flash

# 服务商 API 实际接受的模型名称，请按实际开通的模型填写。
deepseek-flash.modelName=deepseek-flash

# 提供商标识；当前工厂统一通过 ChatOpenAI 调用 OpenAI 兼容接口。
deepseek-flash.provider=openai-compatible
deepseek-flash.baseUrl=https://api.deepseek.com

# 必填：替换为实际 API Key，代码不会自动展开环境变量占位符。
deepseek-flash.apiKey=xxxxxx

# ==================== 通用生成参数 ====================
# 缺失时默认 0.5；配置为空时不向模型传递该参数。
deepseek-flash.temperature=0.5

# 可选：为空时不传递该参数。
deepseek-flash.topP=

# 最大生成长度，需与实际模型支持的范围匹配。
deepseek-flash.maxTokens=16384

# 请求超时，单位为秒；缺失时默认 120.0。
deepseek-flash.timeout=120.0

# ==================== 推理参数 ====================
# 可选：根据服务商支持情况填写 low、medium、high 等值；为空时不传递。
deepseek-flash.reasoningEffort=

# ==================== 能力声明 ====================
# 保留此前提供的声明。当前 build_model_config 尚未读取这三个 key，
# 实际 ModelConfig 中对应字段仍使用默认值 False，不会据此切换模型行为。
deepseek-flash.supportsTools=true
deepseek-flash.supportsStructuredOutput=false
deepseek-flash.supportsReasoning=true

# ==================== 服务商扩展参数 ====================
# 必须为 JSON 对象，使用单行格式；为空或缺失时默认为空字典。
deepseek-flash.extraBody={}
deepseek-flash.extraHeaders={}

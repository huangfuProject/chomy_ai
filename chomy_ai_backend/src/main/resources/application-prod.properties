# 生产环境连接参数由部署环境提供，不设置实际值或默认值；启动前须配置以下三个环境变量。
# Nacos 服务地址，格式为主机名或 IP 加端口，例如 nacos-host:8848。
spring.nacos.config.server-addr=${NACOS_SERVER_ADDRESS}
# 用于读取目标命名空间及配置项的 Nacos 登录用户名。
spring.nacos.config.username=${NACOS_USERNAME}
# 上述 Nacos 账号的登录密码，由部署环境注入。
spring.nacos.config.password=${NACOS_PASSWORD}

spring.application.name=chomy-ai-backend
# 默认加载 application-dev.properties；生产部署时通过启动参数 --spring.profiles.active=prod 切换。
spring.profiles.active=dev

# HTTP 服务监听端口，直接使用固定值 8080；优雅停机时等待正在处理的请求完成。
server.port=8001
server.shutdown=graceful

# 启用 Java 21 虚拟线程
spring.threads.virtual.enabled=true
# 使用虚拟线程时，保持 JVM 在没有平台线程活动时继续运行
spring.main.keep-alive=true
# 使用独立的 Spring Boot Nacos 配置组件，连接参数统一采用 spring.nacos.config 前缀。
# 从指定命名空间及分组读取配置；Data ID 不附加文件扩展名，内容按 Properties 格式解析。
spring.config.import=nacos:${NACOS_CONFIG_DATA_ID:chomy_ai_be}?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
spring.nacos.config.namespace=${NACOS_NAMESPACE_ID:34a480c0-e54d-47f5-9524-726dfe7d82b8}
spring.nacos.config.group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
#spring.nacos.config.file-extension=properties

# 数据库及 Redis 的连接参数从 Nacos 的 db.*、redis.* 配置项获取，不设置本地连接回退值。
spring.datasource.driver-class-name=org.postgresql.Driver
# JDBC 超时单位为秒：建连超时 10 秒，读取超时默认 60 秒；读取超时会关闭连接。
# ApplicationName 标识连接来源；启用 TCP 保活和批量插入重写，读取超时可通过 DB_SOCKET_TIMEOUT 调整。
spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}?ApplicationName=${spring.application.name}&connectTimeout=10&socketTimeout=${DB_SOCKET_TIMEOUT:60}&tcpKeepAlive=true&reWriteBatchedInserts=true
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
# 每个新物理连接在 JDBC 初始化后执行此 SQL，将当前会话时区设置为北京时间，不修改数据库全局时区。
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Shanghai'

spring.data.redis.host=${redis.host}
spring.data.redis.port=${redis.port}
spring.data.redis.password=${redis.password}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=assign_id

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# JWT 与 Redis 登录会话的统一有效期，单位为秒，默认两小时；JWT 过期或缓存缺失均需重新登录。
security.jwt.ttl-seconds=7200
# HS256 密钥使用 Base64 编码，解码后至少 32 字节；生产环境必须提供且多实例保持一致。
# 开发环境留空时生成进程级临时密钥，重启即废止此前签发的 JWT，密钥不会写入日志。
security.jwt.secret-base64=${JWT_SECRET_BASE64:}
